; ═══════════════════════════════════════════════════════════════════════════════
;  BallBot ESP32 — PlatformIO Configuration
;  Board:     ESP32 DevKit V1 (30-pin)
;  Framework: Arduino
; ═══════════════════════════════════════════════════════════════════════════════

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Upload speed — increase for faster flashing (default 460800)
upload_speed = 921600

; Serial monitor filters — shows timestamps and can decode crashes
monitor_filters = esp32_exception_decoder, time

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=1         ; 0=None 1=Error 2=Warn 3=Info 4=Debug 5=Verbose
    -Wall
