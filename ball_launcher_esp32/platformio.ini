; ============================================================================
;  BALL LAUNCHER CONTROL SYSTEM — PlatformIO Configuration
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Upload speed
upload_speed = 921600

; Build flags
build_flags = 
    -D CORE_DEBUG_LEVEL=0

; Serial monitor filters (optional — makes output cleaner)
monitor_filters = 
    direct
    esp32_exception_decoder
